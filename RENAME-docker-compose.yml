services:
  server:
    image: yooooomi/your_spotify_server
    restart: always
    ports:
      - "8080:8080"
    links:
      - mongo
    depends_on:
      - mongo
    environment:
      API_ENDPOINT: https://api-music.lueders.dev # This MUST be included as a valid URL in the spotify dashboard (see below)
      CLIENT_ENDPOINT: https://music.lueders.dev
      SPOTIFY_PUBLIC: XXXXXXXXXXXXXXXXX
      SPOTIFY_SECRET: XXXXXXXXXXXXXXXXX
      CORS: https://music.lueders.dev, https://api-music.lueders.dev, https://music.lueders.dev/login # "i-want-a-security-vulnerability-and-want-to-allow-all-origins" if you want to allow every origin

  mongo:
    container_name: mongo
    image: mongo:4.4.8
    restart: always
    volumes:
      - ./your_spotify_db:/data/db

  web:
    image: yooooomi/your_spotify_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      API_ENDPOINT: https://api-music.lueders.dev
